[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "csv2xlsx"
version = "1.0.0"
description = "Convert CSV files to Excel (.xlsx) from the command line, with a progress bar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["csv", "excel", "xlsx", "cli", "converter"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "behave>=1.2.6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
csv2xlsx = "csv2xlsx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["csv2xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["csv2xlsx"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["csv2xlsx"]
