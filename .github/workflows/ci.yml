name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-sync:
    name: BDD spec is identical in both projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: diff -u src/typescript/features/convert.feature src/python/features/convert.feature

  typescript:
    name: TypeScript (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: src/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:bdd
      - run: npm run build
      - name: Smoke test
        run: node dist/cli.js ../../samples/sample.csv sample.xlsx

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - run: behave
      - name: Smoke test
        run: csv2xlsx ../../samples/sample.csv sample.xlsx
